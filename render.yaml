# BOOMPUFF — Render Blueprint (tek web servisi: oyun + online oda sunucusu)
# Render panelinde: New → Blueprint → bu depoyu seçin. Ücretsiz plan; kredi kartı gerekmez.
services:
  - type: web
    name: boompuff
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    # rootDir=server olduğu için Render varsayılan olarak yalnızca server/ değişince kurar; oyun dosyaları (www/) da tetiklesin
    buildFilter:
      paths:
        - server/**
        - www/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STATIC_DIR
        value: ../www
